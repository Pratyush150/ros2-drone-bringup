[develop]
script_dir=$base/lib/drone_bringup

[install]
install_scripts=$base/lib/drone_bringup

[flake8]
# Match the ROS 2 style: 99 columns, and let the ament linters own the rest.
max-line-length = 99
extend-ignore = E203, W503
exclude = .git,__pycache__,build,install,log

[tool:pytest]
testpaths = tests
python_files = test_*.py
# ROS 2 Humble ships launch_testing / launch_testing_ros pytest plugins whose
# hook signatures predate pytest 8. With a Humble workspace sourced, plain
# `pytest` then dies during plugin registration before it collects anything --
# the error mentions pytest_pycollect_makemodule or
# pytest_launch_collect_makemodule and has nothing to do with your tests.
# These tests are pure Python and need neither plugin. Blocking a plugin that
# is not installed is a no-op, so this line is safe off a ROS machine too.
addopts = -p no:launch_testing -p no:launch_ros
